workflows:
  ios-simulator:
    name: iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          if ! curl -sI --max-time 8 https://github.com >/dev/null 2>&1; then
            echo "140.82.116.3 github.com" | sudo tee -a /etc/hosts
            echo "140.82.113.3 github.com" | sudo tee -a /etc/hosts
            echo "140.82.114.4 github.com" | sudo tee -a /etc/hosts
          fi
          cd ios
          pod install --repo-update || pod install --repo-update || pod install --repo-update
      - name: Build iOS simulator app
        script: flutter build ios --simulator --debug
      - name: Create zip for Appetize
        script: |
          cd build/ios/iphonesimulator
          zip -r Glaya.app.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/*.zip

  ios-app-store:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.glaya.app
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Set up code signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          if ! curl -sI --max-time 8 https://github.com >/dev/null 2>&1; then
            echo "140.82.116.3 github.com" | sudo tee -a /etc/hosts
            echo "140.82.113.3 github.com" | sudo tee -a /etc/hosts
            echo "140.82.114.4 github.com" | sudo tee -a /etc/hosts
          fi
          cd ios
          pod install --repo-update || pod install --repo-update || pod install --repo-update
      - name: Build iOS IPA
        script: xcode-project build-ipa --workspace "ios/Runner.xcworkspace" --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  macos-app-store:
    name: macOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build macOS app
        script: flutter build macos --release
    artifacts:
      - build/macos/Build/Products/Release/*.app
    publishing:
      app_store_connect:
        auth: integration
